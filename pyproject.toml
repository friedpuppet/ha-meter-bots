[project]
name = "ha-meter-bots"
version = "0.4.0"
description = "Home Assistant integration: send meter readings to suppliers' Telegram bots from your own account"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.357",  # = Home Assistant 2026.8.3
    "telethon==1.45.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
